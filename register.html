
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />

        <title>Register - GreenGauge</title>

        <link href="css/styles.css" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="assets/css/bootstrap.min.css">
        <script src="/js/auth/register.js" type="module"></script>

    </head>
    <body class="bg-secondary">
        <div id="layoutAuthentication">
            <div id="layoutAuthentication_content">
                <main>
                    <div class="container">
                        <div class="row justify-content-center">
                            <div class="col-lg-7">
                                <div class="card shadow-lg border-0 rounded-lg mt-5">
                                    <div class="card-header"><h3 class="text-center font-weight-light my-4">
                                        Create Account
                                    </h3>
                                </div>
                                    <div class="card-body">
                                        <!-- Notification -->
                                        <div class="alert alert-success d-none" role="alert"></div>
                                        <div class="alert alert-danger d-none" role="alert"></div>
                                        <!-- Registration Form -->
                                        <form id="form_register">
                                            <div class="row mb-3">
                                                <div class="col-md-6">
                                                    <div class="form-floating mb-3 mb-md-0">
                                                        <!-- First Name Field -->
                                                        <input 
                                                            class="form-control" 
                                                            id="firstname" 
                                                            name="firstname"
                                                            type="text" 
                                                            placeholder="Enter your first name"
                                                            required />
                                                        <label for="firstname">First Name</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="form-floating">
                                                        <!-- Last Name Field -->
                                                        <input 
                                                            class="form-control" 
                                                            id="lastname"
                                                            name="lastname"
                                                            type="text" 
                                                            placeholder="Enter your last name" 
                                                            required />
                                                        <label for="lastname">Last Name</label>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="row mb-3">
                                                <div class="col-md-12">
                                                    <div class="form-floating mb-3">
                                                        <!-- Email Field -->
                                                        <input 
                                                            class="form-control" 
                                                            id="email" 
                                                            name="email"
                                                            type="email" 
                                                            placeholder="name@example.com"
                                                            required />
                                                        <label for="email">Email</label>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="row mb-3">
                                                <div class="col-md-6">
                                                    <div class="form-floating mb-3 mb-md-0">
                                                        <!-- Password Field -->
                                                        <input 
                                                            class="form-control" 
                                                            id="password" 
                                                            name="password"
                                                            type="password" 
                                                            placeholder="Create a password"
                                                            required />
                                                        <label for="password">Password</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="form-floating mb-3 mb-md-0">
                                                        <!-- Password Confirmation Field -->
                                                        <input 
                                                            class="form-control" 
                                                            id="password_confirmation" 
                                                            name="password_confirmation"
                                                            type="password" 
                                                            placeholder="Confirm password"
                                                            required />
                                                        <label for="password_confirmation">Confirm Password</label>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="mt-4 mb-0">
                                                <div class="d-grid">
                                                    <button class="btn btn-primary btn-block d-flex align-items-center justify-content-center" type="submit">
                                                        Create Account
                                                    </button>
                                                </div>
                                            </div>
                                        </form>
                                        
                                    </div>
                                    <div class="card-footer text-center py-3">
                                        <div 
                                            class="small">
                                            Have an account? 
                                            <a href="login.html"> 
                                            Go to login
                                        </a>
                                    </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
            <div id="layoutAuthentication_footer">
                <footer class="py-4 bg-light mt-5">
                    <div class="container-fluid px-4">
                        <div class="justify-content-between small text-center">
                            <div class="text-muted">
                                Copyright &copy; GreenGauge 2025
                            </div>
                    
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="assets/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
