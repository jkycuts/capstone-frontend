              <body>
              
                <div class="form-container mb-3">
                  <h2>GHG Emission Entry</h2>
                   <!-- Notifications -->
<div class="alert alert-success d-none" role="alert"></div>
<div class="alert alert-danger d-none" role="alert"></div>
                  <form id="form_ghg_emission">
                    <!-- General Info -->
                    <h3>General Information</h3>
                    <div class="form-group">
                      <label for="year">Year</label>
                      <input type="text" id="year" name="year">

                    </div>
                
                    <div class="form-group">
                      <label for="quarter">Quarter</label>
                      <select id="quarter" name="quarter" required>
                        <option value="">Select Quarter</option>
                        <option value="Q1">Q1</option>
                        <option value="Q2">Q2</option>
                        <option value="Q3">Q3</option>
                        <option value="Q4">Q4</option>
                      </select>
                    </div>
                
                    <!-- Scope 1 -->
                    <h3>Fuel Consumption</h3>
                    <div class="form-group">
                      <label for="fuel_source">Fuel Source</label>
                      <input type="text" id="fuel_source" name="fuel_source" required>
                    </div>
                
                    <div class="form-group">
                      <label for="fuel_type">Fuel Type</label>
                      <input type="text" id="fuel_type" name="fuel_type" required>
                    </div>
                
                    <div class="form-group">
                      <label for="fuel_liters_used">Liters Used</label>
                      <input type="number" id="fuel_liters_used" name="fuel_liters_used" step="0.01" required>
                    </div>
                
                    <!-- Scope 2 -->
                    <h3>Purchased Electricity</h3>
                    <div class="form-group">
                      <label for="electricity_kwh">Electricity Used (kWh)</label>
                      <input type="number" id="electricity_kwh" name="electricity_kwh" required>
                    </div>
                
                    <!-- Scope 3 -->
                    <h3>Business Travel</h3>
                    <div class="form-group">
                      <label for="travel_category">Travel Category</label>
                      <select id="travel_category" required>
                        <option value="">-- Select Category --</option>
                        <option value="short">Short</option>
                        <option value="medium">Medium</option>
                        <option value="long">Long</option>
                        <option value="unknown">Unknown</option>
                      </select>
                      
                    </div>
                
                    <div class="form-group">
                      <label for="travel_distance_miles">Total Distance (Miles)</label>
                      <input type="number" id="travel_distance_miles" name="travel_distance_miles" required>
                    </div>
                
                    <div class="form-group">
                      <label for="travel_number_of_trips">Number of Trips</label>
                      <input type="number" id="travel_number_of_trips" name="travel_number_of_trips" required>
                    </div>
                
                    <button type="submit" class="custom-button">Submit</button>
                  </form>
                </div>
