              <main>
                <div class="container-fluid my-4">
                  <div class="mx-auto p-4 shadow rounded bg-white" style="max-width: 900px;">
                    <h2 class="text-center mb-4">Scope 2: Emission from Purchased Electricity</h2>
              
                    <!-- Notifications -->
                    <div class="alert alert-success d-none" role="alert"></div>
                    <div class="alert alert-danger d-none" role="alert"></div>
              
                    <form id="form_scope2_electricity">
                        <div class="row">
                            <!-- Mode Selection -->
                            <div class="col-md-6 mb-3">
                                <label for="mode" style="font-weight:600; font-size: large;">
                                    Mode
                                </label>
                                <select class="form-control" id="mode" required>
                                    <option value="" disabled selected>Select Mode</option>
                                    <option value="monthly">Monthly</option>
                                    <option value="quarterly">Quarterly</option>
                                </select>
                            </div>
                    
                            <!-- Year Input -->
                            <div class="col-md-6 mb-3">
                                <label for="year" style="font-weight:600; font-size: large;">
                                    Year
                                </label>
                                <input class="form-control" type="number" placeholder="Year" id="year" required>
                            </div>
                        </div>
                    
                        <div class="row">
                            <!-- Month Input -->
                            <div class="col-md-6 mb-3" id="month_group" style="display:none;">
                                <label for="month" style="font-weight:600; font-size: large;">
                                    Month
                                </label>
                                <select class="form-control" id="month">
                                    <option disabled selected>Select Month</option>
                                    <option value="01">January</option>
                                    <option value="02">February</option>
                                    <option value="03">March</option>
                                    <option value="04">April</option>
                                    <option value="05">May</option>
                                    <option value="06">June</option>
                                    <option value="07">July</option>
                                    <option value="08">August</option>
                                    <option value="09">September</option>
                                    <option value="10">October</option>
                                    <option value="11">November</option>
                                    <option value="12">December</option>
                                </select>
                            </div>
                    
                            <!-- Quarter Input -->
                            <div class="col-md-6 mb-3" id="quarter_group" style="display:none;">
                                <label for="quarter" style="font-weight:600; font-size: large;">
                                    Quarter
                                </label>
                                <select class="form-control" id="quarter">
                                    <option disabled selected>Select Quarter</option>
                                    <option value="Q1">Q1</option>
                                    <option value="Q2">Q2</option>
                                    <option value="Q3">Q3</option>
                                    <option value="Q4">Q4</option>
                                </select>
                            </div>
                        </div>
                    
                        <!-- Electricity Section -->
                        <h4 class="mb-3">Purchased Electricity</h4>
                        <div class="row">
                            <!-- Electricity Used Input -->
                            <div class="mb-3">
                                <label for="electricity_kwh" style="font-weight:600; font-size: medium;">
                                    Electricity Used (kWh)
                                </label>
                                <input class="form-control mt-2" type="number" step="0.01" placeholder="Electricity Used (kWh)" id="electricity_kwh" required>
                            </div>
                    
                            <!-- Emission Factor Input -->
                            <div class="mb-3">
                                <label for="emission_factor" style="font-weight:600; font-size: medium;">
                                    Emission Factor 
                                </label>
                                <input class="form-control mt-2" type="number" step="0.0001" placeholder="e.g., 0.7" id="emission_factor" required>
                            </div>
                    
                            
                        </div>
                    
                        <!-- Submit Button -->
                        <div class="text-center mt-4">
                            <button type="submit" class="custom-button">Save</button>
                        </div>
                    </form>

    <script>
        document.getElementById('mode').addEventListener('change', function () {
            const mode = this.value;
            document.getElementById('month_group').style.display = mode === 'monthly' ? 'block' : 'none';
            document.getElementById('quarter_group').style.display = mode === 'quarterly' ? 'block' : 'none';
        });
        
        document.getElementById('form_scope2_electricity').addEventListener('input', function () {
            const kwh = parseFloat(document.getElementById('electricity_kwh').value) || 0;
            const factor = parseFloat(document.getElementById('emission_factor').value) || 0;
            const emission = (kwh * factor) / 1000;
            document.getElementById('calculated_emission').value = emission.toFixed(4);
        });
        </script>
