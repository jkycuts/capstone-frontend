<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <!-- 1. Summary Dashboard -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
    <div class="bg-white p-4 rounded shadow">
      <h3 class="text-sm font-medium text-gray-500">Total GHG Emissions</h3>
      <p id="total-emissions" class="text-2xl font-bold text-red-600">0 TCO₂</p>
    </div>
    <div class="bg-white p-4 rounded shadow">
      <h3 class="text-sm font-medium text-gray-500">Total Carbon Sequestration</h3>
      <p id="total-sequestration" class="text-2xl font-bold text-green-600">0 TCO₂</p>
    </div>
    <div class="bg-white p-4 rounded shadow">
      <h3 class="text-sm font-medium text-gray-500">Net Carbon Variance</h3>
      <p id="net-variance" class="text-2xl font-bold text-blue-600">0 TCO₂</p>
    </div>
    <div class="bg-white p-4 rounded shadow">
      <h3 class="text-sm font-medium text-gray-500">% of National GHG Contribution</h3>
      <p id="national-contribution" class="text-2xl font-bold text-purple-600">0%</p>
    </div>
  </div>

  <!-- 2. Trend Charts -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
    <div class="bg-white p-4 rounded shadow">
      <h3 class="text-lg font-semibold mb-2">Emissions Over Time</h3>
      <canvas id="emissionsChart"></canvas>
    </div>
    <div class="bg-white p-4 rounded shadow">
      <h3 class="text-lg font-semibold mb-2">Sequestration Over Time</h3>
      <canvas id="sequestrationChart"></canvas>
    </div>
  </div>

  <!-- 3. Company Monitoring Table -->
  <div class="bg-white p-4 rounded shadow">
    <div class="flex justify-between mb-4">
      <input type="text" id="companySearch" class="border px-3 py-2 rounded w-1/3" placeholder="Search Company..." />
      <select id="industryFilter" class="border px-3 py-2 rounded">
        <option value="">All Industries</option>
        <option value="Mining">Mining</option>
        <option value="Agriculture">Agriculture</option>
        <!-- Add more industries as needed -->
      </select>
    </div>
    <table class="w-full text-sm text-left table-auto border">
      <thead class="bg-gray-200">
        <tr>
          <th class="p-2 border">Company</th>
          <th class="p-2 border">Industry</th>
          <th class="p-2 border">Year</th>
          <th class="p-2 border">GHG Emissions</th>
          <th class="p-2 border">Carbon Sequestration</th>
          <th class="p-2 border">Net Variance</th>
          <th class="p-2 border">Status</th>
        </tr>
      </thead>
      <tbody id="companyTableBody">
        <!-- Data loaded via JS -->
      </tbody>
    </table>
  </div>

  <script src="admin-dashboard.js"></script>
</body>
</html>
