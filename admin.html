<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Company GHG Summary</title>
    <script type="module" src="js/admin.dasboard/admin-dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto px-4 py-6">

      <div class="mb-4">
    <!-- Example Button: Go to User Page -->
    <a href="index.html" class="bg-green-500 text-white px-4 py-2 rounded shadow hover:bg-green-600 inline-block text-center">
        Go to User Page
    </a>
</div>

    <h1 class="text-3xl font-bold mb-6">Company Summary Dashboard</h1>

    <!-- Notifications -->
    <div class="alert alert-success d-none mt-3" role="alert"></div>
    <div class="alert alert-danger d-none mt-3" role="alert"></div>

    <!-- Year Selection -->
    <div class="mb-4 flex items-center gap-4">
        <label for="yearSelect" class="font-medium">Select Year:</label>
        <select id="yearSelect" class="border px-2 py-1 rounded bg-white shadow">
            <option value="">Loading...</option>
        </select>

        <input type="text" id="companySearch" placeholder="Search company..." class="border px-2 py-1 rounded ml-auto w-64" />
    </div>

    <!-- KPIs -->
    <div class="grid grid-cols-4 gap-4 mb-6">
        <div class="bg-white shadow p-4 rounded text-danger">
            <p class="text-gray-500">Total Emissions</p>
            <h2 id="total_emissions" class="text-xl font-bold">0 TCO₂</h2>
        </div>
        <div class="bg-white shadow p-4 rounded">
            <p class="text-gray-500">Total Sequestration</p>
            <h2 id="total_sequestration" class="text-xl font-bold">0 TCO₂</h2>
        </div>
        <div class="bg-white shadow p-4 rounded">
            <p class="text-gray-500">Net Variance</p>
            <h2 id="net_variance" class="text-xl font-bold">0 TCO₂</h2>
        </div>
        <div class="bg-white shadow p-4 rounded">
            <p class="text-gray-500">National Contribution</p>
            <h2 id="national_contribution_percent" class="text-xl font-bold">0%</h2>
        </div>
    </div>

    <!-- Graph Section -->
    <div class="bg-white shadow p-4 rounded-lg mb-6">
  <h2 class="text-lg font-semibold mb-2">GHG Emissions Over Time</h2>
  <div class="relative w-full max-w-md h-64 mx-auto"> <!-- max-w-md = ~28rem wide -->
    <canvas id="ghgChart"></canvas>
  </div>
</div>


    <!-- Table -->
    <div class="overflow-auto">
        <table class="min-w-full bg-white rounded shadow">
            <thead class="bg-gray-200 text-left">
                <tr>
                    <th class="p-2 border">Company</th>
                    <th class="p-2 border">Year</th>
                    <th class="p-2 border">Emissions</th>
                    <th class="p-2 border">Sequestration</th>
                    <th class="p-2 border">Net Variance</th>
                    <th class="p-2 border">Status</th>
                </tr>
            </thead>
            <tbody id="company-table-body">
                <tr><td colspan="6" class="text-center p-4">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
