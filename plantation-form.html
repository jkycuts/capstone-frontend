            <div id="layoutSidenav_content">
                <main class="container mt-5">
                    <div class="card shadow-sm p-4">
                        <h2 class="text-center mb-4">Plantation Form</h2>
                
                        <!-- Notifications -->
                        <div class="alert alert-success d-none" role="alert" id="successAlert"></div>
                        <div class="alert alert-danger d-none" role="alert" id="errorAlert"></div>
                
                        <form id="form_plantation" enctype="multipart/form-data" method="POST">

                            <label for="form-label " style="font-weight:600; font-size: large;">
                                Area Planted (Hectares)
                            </label>
                            <input class="form-control mb-4 mt-2" type="text" placeholder="Area Planted (Hectares)" aria-label="area_planted" step="0.01" id = "area_planted" name="area_planted" required>

                            <label for="form-label " style="font-weight:600; font-size: large;">
                                Seedlings Planted
                            </label>
                            <input class="form-control mb-4 mt-2" type="text" placeholder="Seedlings Planted" aria-label="seedlings_planted"  id = "seedlings_planted" name="seedlings_planted" required>
                
                            <label for="form-label " style="font-weight:600; font-size: large;">
                                Age of Plantation
                            </label>
                            <input class="form-control mb-4 mt-2" type="text" placeholder="Age of Plantation" aria-label="plantation_age" id = "plantation_age" name="plantation_age" required>

                            <div class="col-md-4 mb-3">
                                <label for="form-label " style="font-weight:600; font-size:medium;">
                                  Date Recorded
                              </label>
                                <input class="form-control mt-2" type="date" placeholder="Date Recorded" id="date_recorded" name="date_recorded" required>
                              </div>
                
                            <button type="submit" class="custom-button">Save</button>
                        </form>
                    </div>
