                        <div class="form-container">
                            <h2>Tree Growth Form</h2>
                            
                             <!-- Notifications -->
                        <div class="alert alert-success d-none" role="alert"></div>
                        <div class="alert alert-danger d-none" role="alert"></div>

                        <form id="form_tree-growth">

                                <div class="form-group">
                                    <label for="dbh">Diameter at Breast Height (cm)</label>
                                    <input type="number" step="0.1" id="dbh" name="dbh" required>
                                </div>
                    
                                <div class="form-group">
                                    <label for="height">Tree Height (m)</label>
                                    <input type="number" step="0.1" id="height" name="height" required>
                                </div>
                    
                                <div class="form-group">
                                    <label for="latitude">Latitude</label>
                                    <input type="number" step="0.000001" id="latitude" name="latitude" required>
                                </div>
                    
                                <div class="form-group">
                                    <label for="longitude">Longitude</label>
                                    <input type="number" step="0.000001" id="longitude" name="longitude" required>
                                </div>
                    
                                <button type="submit" class="custom-button">Submit</button>
                            </form>
                        </div>
