<div id="company-profile" class="p-4 hidden">
  <div class="mb-4">
    <h2 class="text-2xl font-bold" id="company-name"></h2>
    <p id="company-industry" class="text-gray-600"></p>
  </div>

  <!-- KPIs -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div class="p-4 bg-white rounded shadow">
      <div class="text-gray-500">Total GHG Emissions</div>
      <div class="text-xl font-bold" id="kpi-emission">-</div>
    </div>
    <div class="p-4 bg-white rounded shadow">
      <div class="text-gray-500">Carbon Sequestration</div>
      <div class="text-xl font-bold" id="kpi-sequestration">-</div>
    </div>
    <div class="p-4 bg-white rounded shadow">
      <div class="text-gray-500">Net Variance</div>
      <div class="text-xl font-bold" id="kpi-variance">-</div>
    </div>
    <div class="p-4 bg-white rounded shadow">
      <div class="text-gray-500">% National Contribution</div>
      <div class="text-xl font-bold" id="kpi-percent">-</div>
    </div>
  </div>

  <!-- Charts -->
  <canvas id="emissionTrendChart" class="mb-6"></canvas>

  <!-- Emissions Breakdown -->
  <div class="mb-6">
    <h3 class="text-lg font-semibold mb-2">Emission Breakdown by Scope</h3>
    <pre id="emission-breakdown" class="bg-gray-100 p-4 rounded text-sm overflow-x-auto"></pre>
  </div>

  <!-- Sequestration -->
  <div>
    <h3 class="text-lg font-semibold mb-2">Sequestration</h3>
    <p>Total Area Planted: <span id="area-planted"></span> ha</p>
    <p>Total Trees: <span id="tree-count"></span></p>
    <p>Average Tree Age: <span id="tree-age"></span> yrs</p>
  </div>
</div>
