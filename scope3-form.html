              <main>
                <div class="container-fluid my-4">
                  <div class="mx-auto p-4 shadow rounded bg-white" style="max-width: 900px;">
                    <h2 class="text-center mb-4">Scope 3: Emission from Air Business Travel</h2>
              
                    <!-- Notifications -->
                    <div class="alert alert-success d-none" role="alert"></div>
                    <div class="alert alert-danger d-none" role="alert"></div>
              
                    <form id="form_scope3_travel">

                      <div class="row">
                        <div class="col-md-4 mb-3">
                          <label style="font-weight:600; font-size: large;">Year</label>
                          <input class="form-control mt-2" type="number" placeholder="Year" id="year" required>
                        </div>
                    
                        <div class="col-md-4 mb-3">
                          <label style="font-weight:600; font-size: large;">Mode</label>
                          <select class="form-select mt-2" id="mode" required>
                            <option selected disabled value="">Select Mode</option>
                            <option value="monthly">Monthly</option>
                            <option value="quarterly">Quarterly</option>
                          </select>
                        </div>
                    
                        <div class="col-md-4 mb-3 d-none" id="month_container">
                          <label style="font-weight:600; font-size: large;">Month</label>
                          <select class="form-select mt-2" id="month">
                            <option disabled selected value="">Select Month</option>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December">December</option>
                          </select>
                        </div>
                    
                        <div class="col-md-4 mb-3 d-none" id="quarter_container">
                          <label style="font-weight:600; font-size: large;">Quarter</label>
                          <select class="form-select mt-2" id="quarter">
                            <option disabled selected value="">Select Quarter</option>
                            <option value="Q1">Q1</option>
                            <option value="Q2">Q2</option>
                            <option value="Q3">Q3</option>
                            <option value="Q4">Q4</option>
                          </select>
                        </div>
                      </div>
                    
                      <h4 class="mb-3">Business Travel</h4>
                      <div class="row">
                        <div class="col-md-4 mb-3">
                          <label style="font-weight:600; font-size: medium;">Category</label>
                          <select class="form-select mt-2" id="travel_type" required>
                            <option selected disabled value="">Category</option>
                            <option value="short">Short Haul</option>
                            <option value="medium">Medium Haul</option>
                            <option value="long">Long Haul</option>
                          </select>
                        </div>
                    
                        <div class="col-md-4 mb-3">
                          <label style="font-weight:600; font-size: medium;">Total Distance (Miles)</label>
                          <input class="form-control mt-2" type="number" placeholder="Total Distance" step="0.01" id="travel_distance_miles" required>
                        </div>

                        <div class="col-md-6 mb-3">
                          <label for="gas_type" class="form-label" >Gas Type</label>
                          <select class="form-control" id="gas_type" required>
                            <option value="">Select Gas</option>
                            <option value="co2">CO₂</option>
                            <option value="ch4">CH₄</option>
                            <option value="n2o">N₂O</option>
                          </select>
                        </div>
                    
                        <div class="col-md-4 mb-3">
                          <label style="font-weight:600; font-size: medium;">Emission Factor</label>
                          <input class="form-control mt-2" type="number" placeholder="e.g. 0.133" step="0.0000000001" id="emission_factor" required>
                        </div>
                        
                    
                        <div class="col-md-4 mb-3">
                          <label style="font-weight:600; font-size: medium;">GWP</label>
                          <input class="form-control mt-2" type="number" step="0.000000001" placeholder="e.g. 1.0" id="gwp" required>
                        </div>
                      </div>
                    
                      <div class="text-center mt-4">
                        <button type="submit" class="custom-button">Save</button>
                      </div>
                    </form>
