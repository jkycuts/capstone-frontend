                    <div class="alert alert-danger d-none" role="alert"></div>
              
                    <form id="form_scope3_travel">
 
                      <div class="row">
                        <div class="col-md-6 mb-3">
                          <label for="form-label " style="font-weight:600; font-size: large;">
                            Year
                        </label>
                          <input class="form-control mt-2" type="number" placeholder="Year" id="year" required>
                        </div>

                      </div>

                     
 
                      <!-- Scope 3: Travel -->
                      <h4 class="mb-3">Business Travel</h4>
                      <div class="row">
                        <div class="col-md-4 mb-3">
                          <label for="form-label " style="font-weight:600; font-size: medium;">
                           Category (Short, Medium, Long)
                        </label>
                          <select class="form-select mt-2" id="travel_type" name="travel_type" required>
                            <option selected disabled>Category</option>
                            <option value="short">Short Haul</option>
                            <option value="medium">Medium Haul</option>
                            <option value="long">Long Haul</option>
                            
                        </select>
                        
                        </div>
                        <div class="col-md-4 mb-3">
                          <label for="form-label " style="font-weight:600; font-size: medium;">
                            Total Distance (Miles)
                        </label>
                          <input class="form-control mt-2" type="number" placeholder="Total Distance (Miles)" id="travel_distance_miles" name="travel_distance_miles" required>
                        </div>

                        

                        
                        
                      </div>
              
                      <div class="text-center mt-4">
                        <button type="submit" class="custom-button">Save</button>
                      </div>
                    </form>
